name: ScreenThyme

options:
  bundleIdPrefix: com.danfoygel
  deploymentTarget:
    iOS: "26.4"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ZVU48K8YCD
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

packages:
  ThymeKit:
    path: ThymeKit

targets:
  # One app, two roles (kid / parent), chosen at first launch. PLAN.md §5.
  ScreenThyme:
    type: application
    platform: iOS
    sources:
      - ScreenThyme
      - Shared
    dependencies:
      - package: ThymeKit
        product: ThymeCore
      - target: ThymeMonitor
      - target: ThymeReport
      - target: ThymeShield
      - target: ThymeShieldAction
    entitlements:
      path: ScreenThyme/ScreenThyme.entitlements
      properties:
        com.apple.developer.family-controls: true
        # S4: iOS 26.4 data access (approvedWithDataAccess, DeviceActivityData.activityData). PLAN.md §3, §12.
        com.apple.developer.family-controls.app-and-website-usage: true
        com.apple.security.application-groups: [group.com.danfoygel.screenthyme]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.danfoygel.screenthyme]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
    info:
      path: ScreenThyme/Info.plist
      properties:
        UIBackgroundModes: [remote-notification, fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.danfoygel.screenthyme.refresh]
        CKSharingSupported: true
        # The nearby link: Bonjour over Wi-Fi and peer-to-peer Wi-Fi, no internet (PLAN.md §17).
        NSBonjourServices: [_screenthyme._tcp]
        NSLocalNetworkUsageDescription: ScreenThyme talks to your family's phones nearby, so usage and answers to requests for more time arrive even without the internet.
        # Matching a kid's scanned apps: a parent's camera reads the codes on the kid's screen (PLAN.md §15.6).
        NSCameraUsageDescription: ScreenThyme reads the codes on your kid's screen to match the apps it scanned.
        NSBluetoothAlwaysUsageDescription: ScreenThyme talks to your family's phones nearby over Bluetooth when Wi-Fi is off, so usage and answers to requests for more time still arrive.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danfoygel.screenthyme
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ScreenThyme
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Capture: each total-use threshold wakes it to fetch Apple's per-app data, evaluate rules and upload (PLAN.md §13).
  ThymeMonitor:
    type: app-extension
    platform: iOS
    sources:
      - ThymeMonitor
      - Shared
    dependencies:
      - package: ThymeKit
        product: ThymeCore
    entitlements:
      path: ThymeMonitor/ThymeMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.developer.family-controls.app-and-website-usage: true
        com.apple.security.application-groups: [group.com.danfoygel.screenthyme]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.danfoygel.screenthyme]
        com.apple.developer.icloud-services: [CloudKit]
    info:
      path: ThymeMonitor/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThymeMonitorExtension
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danfoygel.screenthyme.monitor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ScreenThyme Monitor

  # The block page: why something is blocked, and "Ask for more time" (PLAN.md §15.2).
  ThymeShield:
    type: app-extension
    platform: iOS
    sources:
      - ThymeShield
      - Shared/Storage
      - Shared/Shield
      - Shared/ScreenTime/TokenCoding.swift
    dependencies:
      - package: ThymeKit
        product: ThymeCore
    entitlements:
      path: ThymeShield/ThymeShield.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.danfoygel.screenthyme]
    info:
      path: ThymeShield/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danfoygel.screenthyme.shield
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ScreenThyme Shield

  # The block page's buttons: "Ask for more time" opens ScreenThyme (PLAN.md §15.4); "One more minute" enforces
  # here (§15.5), so it needs the Enforcer.
  ThymeShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - ThymeShieldAction
      - Shared/Storage
      - Shared/Shield
      - Shared/ScreenTime/TokenCoding.swift
      - Shared/ScreenTime/Enforcer.swift
      - Shared/ScreenTime/UsageSnapshot.swift
    dependencies:
      - package: ThymeKit
        product: ThymeCore
    entitlements:
      path: ThymeShieldAction/ThymeShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.danfoygel.screenthyme]
    info:
      path: ThymeShieldAction/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danfoygel.screenthyme.shieldaction
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ScreenThyme Shield Action

  # Apple's own numbers, shown on the kid's phone only (sandboxed: no network, no export).
  # It reads the app scan from the App Group (read-only) to pair scanned tokens with bundle IDs (PLAN.md §15.6).
  ThymeReport:
    type: extensionkit-extension
    platform: iOS
    sources:
      - ThymeReport
      - Shared/Storage
      - Shared/ScreenTime/TokenCoding.swift
    dependencies:
      - package: ThymeKit
        product: ThymeCore
    entitlements:
      path: ThymeReport/ThymeReport.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.danfoygel.screenthyme]
    info:
      path: ThymeReport/Info.plist
      properties:
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danfoygel.screenthyme.report
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ScreenThyme Report

schemes:
  ScreenThyme:
    build:
      targets:
        ScreenThyme: all
    run:
      config: Debug
